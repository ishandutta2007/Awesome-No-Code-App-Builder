<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.7; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    
    .bg-orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-orb2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 250px; }
    .flow-line { stroke-dasharray: 8 8; animation: dashFlow 20s linear infinite; }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs in Background (Behind Text) -->
  <circle class="bg-orb1" cx="200" cy="100" r="140" fill="#3b82f6" filter="url(#glow)" opacity="0.3" />
  <circle class="bg-orb2" cx="1000" cy="250" r="160" fill="#8b5cf6" filter="url(#glow)" opacity="0.3" />

  <!-- Animated Tech Flow / Node Grid Lines (Background decoration) -->
  <path class="flow-line" d="M 50 80 Q 300 20 550 80 T 1150 80" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.25" />
  <path class="flow-line" d="M 50 280 Q 300 340 600 280 T 1150 280" stroke="#c084fc" stroke-width="1.5" fill="none" opacity="0.2" />

  <!-- Subtle Container Cards for Visual Structure (Lower z-index) -->
  <rect x="60" y="40" width="1080" height="280" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Decorative Pills / Tags (Positioned away from main center text) -->
  <g class="pill-1">
    <rect x="90" y="65" width="140" height="32" rx="16" fill="url(#pillGrad1)" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1" />
    <text x="160" y="86" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ NO-CODE</text>
  </g>

  <g class="pill-2">
    <rect x="970" y="65" width="140" height="32" rx="16" fill="url(#pillGrad2)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1" />
    <text x="1040" y="86" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛠️ LOW-CODE</text>
  </g>

  <g class="pill-3">
    <rect x="90" y="265" width="160" height="32" rx="16" fill="url(#pillGrad1)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="170" y="286" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 OPEN SOURCE</text>
  </g>

  <!-- FOREGROUND TEXT CONTENT (Guaranteed high visibility and contrast) -->
  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" filter="url(#subtleGlow)" letter-spacing="0.5">
    Awesome No-Code App Builder
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#e2e8f0" letter-spacing="0.2">
    The Ultimate Ecosystem of SaaS Platforms &amp; Self-Hosted Open-Source Internal Tool Builders
  </text>

  <!-- Metric Badges Row inside Banner -->
  <g transform="translate(600, 240)">
    <!-- Pill 1 -->
    <rect x="-240" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="-170" y="18" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">🚀 25+ Solutions</text>

    <!-- Pill 2 -->
    <rect x="-70" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="0" y="18" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600">⭐️ Star Sorted</text>

    <!-- Pill 3 -->
    <rect x="100" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
    <text x="170" y="18" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="600">📊 Pricing &amp; Scale</text>
  </g>
</svg>
